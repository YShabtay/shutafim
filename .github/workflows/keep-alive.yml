name: keep-alive

# Free Supabase projects pause after a week without activity.
# This pings the public API once a day so the project stays awake.
# The key below is the public (publishable) key that already ships in the website bundle.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS "https://uclmebrchsdphqvddgmo.supabase.co/rest/v1/posts?select=id&limit=1" \
            -H "apikey: sb_publishable_CSmn2PlYhsbPB0uOZqsrbg_uOW6S0Cn" \
            -H "Authorization: Bearer sb_publishable_CSmn2PlYhsbPB0uOZqsrbg_uOW6S0Cn"
